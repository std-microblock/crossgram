- id: 312edd83
  name: '@cordisjs/plugin-timer'
- id: 0a9ec786
  name: '@cordisjs/plugin-http'
- id: 4cd8d0ee
  name: '@cordisjs/plugin-http-socks'
- id: mtproto01
  name: '@mtproto-relay/mtproto'
  config:
    port: 4430
    host: 127.0.0.1
    rsaKeyPath: ./data/rsa-key.json
    authKeyStorePath: ./data/auth-keys.json
- id: bridge01
  name: '@mtproto-relay/bridge'
  config: {}
- id: satori-core
  name: '@satorijs/core'
  disabled: true
- id: satori-platform
  name: '@mtproto-relay/platform-satori'
  disabled: true
  config:
    bot: ''
- id: telegram-resources
  name: '@mtproto-relay/telegram-resources'
  config: {}
- id: relay01
  name: '@mtproto-relay/relay'
  disabled: true
  config:
    apiId: 0
    apiHash: ''
- id: static
  name: '@mtproto-relay/platform-static'
  disabled: true
  config:
    eventIntervalMs: 20000
- id: qqnt
  name: '@mtproto-relay/platform-qqnt'
  config:
    webSocketEndpoint: ws://127.0.0.1:18767/v1/events/ws
    endpoint: http://127.0.0.1:18768/v1
    generatePreviews: true
- id: discord
  name: '@mtproto-relay/platform-discord'
  disabled: true
  config:
    token: ''
- id: matrix
  name: '@mtproto-relay/platform-matrix'
  disabled: true
  config:
    homeserver: https://matrix.example.com
    accessToken: replace-with-matrix-access-token
    syncTimeoutMs: 30000
    requestTimeoutMs: 30000
- id: mtproto-debug
  name: '@mtproto-relay/mtproto-debug'
  config:
    maxEvents: 2000
- id: fa2b056a
  name: '@cordisjs/plugin-server'
  config:
