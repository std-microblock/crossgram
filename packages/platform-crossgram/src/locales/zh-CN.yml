endpoint: QQNT 网桥 HTTP API 的基础地址。
webSocketEndpoint: QQNT 网桥 WebSocket 事件流的完整地址。留空时从 HTTP 地址自动推导。
token: 用于认证 QQNT 网桥的 Bearer Token。
memberName: 群成员显示名称的取值方式。
mediaCachePath: 用于缓存媒体、预览图、贴纸和回应资源的目录。
mediaDownloadMode: 按需下载原始媒体，或自动缓存符合条件的媒体。
autoDownloadFileSizeLimit: 允许自动缓存的文件大小上限，单位为字节。
previewMaxDimension: 生成图片预览的最大宽度或高度。
ffmpegPath: 将 GIF 和 APNG 媒体转换为 WebM 时使用的 FFmpeg 可执行文件。
