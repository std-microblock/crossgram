[package]
name = "crossgram-voice-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Isolated local IPC and cryptographic foundation for Crossgram voice calls"
publish = false

[features]
test-fake = []
tgcalls-backend = []
# Links the reviewed, versioned C ABI shim. This is the only feature that
# selects the native production media backend in the worker executable.
native-tgcalls-shim = ["tgcalls-backend"]

[dependencies]
crypto-bigint = { version = "=0.7.5", default-features = false, features = ["zeroize"] }
nix = { version = "=0.30.1", features = ["fs", "socket", "user"] }
sha1 = "=0.10.6"
sha2 = "=0.10.9"
zeroize = { version = "=1.8.2", features = ["derive"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
