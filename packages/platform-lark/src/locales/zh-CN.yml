appId: 飞书/Lark 自建应用的 App ID。
appSecret: 飞书/Lark 自建应用的 App Secret。
baseUrl: 开放平台 API 地址；飞书为 https://open.feishu.cn（默认），Lark 国际版为 https://open.larksuite.com。
mode: bot＝应用身份收发（WS 事件 + 机器人进群）；user＝用户身份收发（OAuth 授权 + 轮询）。
publicUrl: OAuth 回调使用的公网基地址（如 https://relay.example.com）；缺省使用内置 HTTP 服务地址。仅 user 模式需要。
pollIntervalMs: user 模式每个会话的轮询间隔（毫秒），默认 60000。
proxy: 可选的 HTTP(S) 代理，用于 Lark API 和媒体请求，例如 http://127.0.0.1:7890。
requestTimeoutMs: Lark 普通 HTTP 请求的最大等待时间（毫秒）。
