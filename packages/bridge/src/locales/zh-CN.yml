dcId: 网桥向 Telegram 客户端公布的数据中心 ID。
serverHost: 向 Telegram 客户端公布的 MTProto 主机地址。
serverPort: 向 Telegram 客户端公布的 MTProto 端口。
apiPrefix: 平台账户资源使用的 HTTP 路径前缀。
uploadPath: 用于存储 Telegram 客户端上传文件的目录。
autoMuteGroupChats: 默认关闭群聊通知；可在 Telegram 中为单个群聊单独开启。
voiceWorkerSocketPath: Rust 语音工作进程的本地 Unix socket 路径；留空以禁用语音通话。
voiceWorkerTimeoutMs: 单次本地语音工作进程请求允许的最长毫秒数。
