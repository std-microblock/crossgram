dcId: Telegram data-center ID advertised by the bridge.
serverHost: Public MTProto host advertised to Telegram clients.
serverPort: Public MTProto port advertised to Telegram clients.
apiPrefix: HTTP prefix used for platform account assets.
uploadPath: Directory used to store uploads received from Telegram clients.
autoMuteGroupChats: Mute group chats by default; per-chat Telegram settings can override this.
voiceWorkerSocketPath: Local Unix socket path for the Rust voice worker; leave empty to disable voice calls.
voiceWorkerTimeoutMs: Maximum time in milliseconds for one local voice-worker request.
voiceDirectIce: Allow direct ICE only when the configured MTProto host is loopback.
