maxEvents: Maximum number of decoded MTProto events retained in memory (the capture page can override it at runtime).
initiallyPaused: Wait for the user to start capture after startup.
apiPath: Read-only HTTP JSON endpoint for querying decoded MTProto capture events.
recordingsPath: Directory where saved capture logs are stored as JSON files.
recordingsApiPath: HTTP endpoint for saving, listing, downloading and deleting capture logs.
maxRecordings: Maximum number of saved capture logs kept on disk; the oldest are pruned.
